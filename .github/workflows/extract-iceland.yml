name: Extrair Iceland - meshes, atlas e texturas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-iceland.yml"
      - "scripts/extract_iceland.py"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitHub Pages prototype
        uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout original SurfVT14 Iceland files
        uses: actions/checkout@v4
        with:
          repository: vtcaua2014-dev/surfvt
          ref: main
          path: source
          lfs: true
          sparse-checkout: |
            public/maps/iceland/build/iceland
          sparse-checkout-cone-mode: true

      - name: Python for Unity asset decoding
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "UnityPy>=1.20,<2" Brotli Pillow

      - name: Inspect Iceland Unity data and export assets
        id: extract
        continue-on-error: true
        run: |
          python site/scripts/extract_iceland.py \
            --source source/public/maps/iceland/build/iceland/iceland.alt.data.unityweb \
            --output site/iceland/extracted \
            --max-mb 55

      - name: Publish extraction inventory and recovered assets
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          if test ! -f iceland/extracted/manifest.json; then
            mkdir -p iceland/extracted
            printf '{"status":"not-extracted","assets":[],"rawFiles":[],"errors":["Extractor did not produce a manifest. Check the GitHub Actions logs."]}\n' > iceland/extracted/manifest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iceland/extracted
          if git diff --cached --quiet; then
            echo "No new Iceland assets to publish"
          else
            git commit -m "Publish Iceland assets extracted from Unity 2019 build"
            git push origin HEAD:main
          fi

      - name: Save extraction report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iceland-extraction-report
          path: site/iceland/extracted/manifest.json
          if-no-files-found: warn

      - name: Report result
        if: always()
        shell: bash
        run: |
          if [ -f site/iceland/extracted/manifest.json ]; then
            python -c 'import json; m=json.load(open("site/iceland/extracted/manifest.json")); print("Iceland status:",m.get("status"),"exported files:",m.get("exportedFiles",0),"errors:",m.get("errors",[])[:5])'
          fi
