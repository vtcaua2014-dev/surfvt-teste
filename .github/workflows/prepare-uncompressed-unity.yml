name: Prepare uncompressed Unity WebGL assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-uncompressed-unity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Brotli support
        run: python -m pip install --disable-pip-version-check brotli
      - name: Decompress Unity framework and WebAssembly
        run: |
          python - <<'PY'
          from pathlib import Path
          import brotli
          from hashlib import sha256
          build = Path("Build")
          assets = [
              ("miamiSiteBuild.framework.js.unityweb", "miamiSiteBuild.framework.js", b"\nvar unityFramework"),
              ("miamiSiteBuild.wasm.unityweb", "miamiSiteBuild.wasm", b"\x00asm"),
          ]
          for source, target, magic in assets:
              compressed = (build / source).read_bytes()
              assert b"UnityWeb Compressed Content (brotli)" in compressed[:80], source
              data = brotli.decompress(compressed)
              assert data.startswith(magic), f"unexpected decompressed signature: {source}"
              assert len(data) < 100_000_000, f"GitHub 100MB file limit exceeded: {target}"
              (build / target).write_bytes(data)
              print(f"Decompressed {source} → {target}: {len(compressed):,} to {len(data):,} bytes, SHA256={sha256(data).hexdigest()}")
          PY
      - name: Commit decompressed files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Build/miamiSiteBuild.framework.js Build/miamiSiteBuild.wasm
          if ! git diff --cached --quiet; then
            git commit -m "Host uncompressed Unity framework and wasm for GitHub Pages"
            git push origin HEAD:main
          else
            echo "Assets already up to date."
          fi
